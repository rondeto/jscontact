name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      # Rector needs an optimized autoloader to resolve classes.
      - uses: ramsey/composer-install@v4
        with:
          composer-options: '--optimize-autoloader'

      # Every step runs even if a previous one failed, so a single run reports every problem.
      - name: PHPStan
        if: ${{ !cancelled() }}
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: PHP-CS-Fixer
        if: ${{ !cancelled() }}
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Rector
        if: ${{ !cancelled() }}
        run: vendor/bin/rector --dry-run --ansi

      - name: Composer validate
        if: ${{ !cancelled() }}
        run: composer validate --strict --no-check-lock

      - name: Autoload (PSR-4 compliance)
        if: ${{ !cancelled() }}
        run: composer dump-autoload --dev -o --dry-run --strict-psr --strict-ambiguous

      - name: Composer audit
        if: ${{ !cancelled() }}
        run: composer audit

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.4'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: PHPUnit
        run: vendor/bin/phpunit
